<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
  <meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#071015">
<link
  rel="icon"
  type="image/png"
  href="assets/logo/LOGO.png?v=20260908-1"
>

<link
  rel="apple-touch-icon"
  href="assets/logo/LOGO.png?v=20260908-1"
>
  <meta name="description" content="Status teknis VOLTIX V2"><title>VOLTIX V2 · Advanced</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v2.css?v=20260908-1">
</head>
<body>
  <div class="app-layout"><aside class="sidebar" id="sidebar"></aside><div class="main-content"><header class="topbar" id="topbar"></header>
    <main class="page-content page-stack">
      <header class="page-head"><div>
       
        <h1>Advanced Monitoring</h1>
       
      </div></header>
      <section class="advanced-grid-v2">
        <article class="stat-card cyan advanced-card-v2"><div class="stat-label">Tegangan</div><div><span class="stat-value" id="adv-voltage">0.0</span><span class="stat-unit">V</span></div></article>
        <article class="stat-card green advanced-card-v2"><div class="stat-label">Arus</div><div><span class="stat-value" id="adv-current">0.000</span><span class="stat-unit">A</span></div></article>
        <article class="stat-card amber advanced-card-v2"><div class="stat-label">Daya</div><div><span class="stat-value" id="adv-power">0.0</span><span class="stat-unit">W</span></div></article>
        <article class="stat-card cyan advanced-card-v2"><div class="stat-label">Energi PZEM</div><div><span class="stat-value" id="adv-energy">0.000</span><span class="stat-unit">kWh</span></div></article>
        <article class="stat-card green advanced-card-v2"><div class="stat-label">Frekuensi</div><div><span class="stat-value" id="adv-frequency">0.0</span><span class="stat-unit">Hz</span></div></article>
        <article class="stat-card amber advanced-card-v2"><div class="stat-label">Power factor</div><div><span class="stat-value" id="adv-pf">0.00</span></div></article>
      </section>
      <section class="settings-grid">
        <article class="card settings-card-v2 advanced-state-card"><h2>State Perangkat</h2><div class="field-grid"><div class="field"><label>Operating mode</label><strong id="adv-mode">—</strong></div><div class="field"><label>Network state</label><strong id="adv-network">—</strong></div><div class="field"><label>Session state</label><strong id="adv-session">—</strong></div><div class="field"><label>Relay</label><strong id="adv-relay">OFF</strong></div><div class="field"><label>Sensor valid</label><strong id="adv-valid">TIDAK</strong></div><div class="field"><label>Pending history</label><strong id="adv-pending">0</strong></div></div></article>
      </section>
    </main>
  </div></div>
  <script type="module" src="js/advanced.js"></script>
</body>
</html>
