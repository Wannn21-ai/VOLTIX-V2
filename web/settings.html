<!doctype html>
<html lang="id">
<head>
  <meta charset="utf-8">
 <meta
  name="viewport"
  content="width=device-width,initial-scale=1,viewport-fit=cover"
>
<meta name="theme-color" content="#071015">
<link
  rel="icon"
  type="image/png"
  href="assets/logo/LOGO.png?v=20260908-1"
>

<link
  rel="apple-touch-icon"
  href="assets/logo/LOGO.png?v=20260908-1"
>
  <meta name="description" content="Pengaturan monitoring VOLTIX V2"><title>VOLTIX V2 · Pengaturan</title>
  <link rel="stylesheet" href="css/style.css"><link rel="stylesheet" href="css/v2.css?v=20260908-1">
</head>
<body>
  <div class="app-layout"><aside class="sidebar" id="sidebar"></aside><div class="main-content"><header class="topbar" id="topbar"></header>
    <main class="page-content page-stack">
      <header class="page-head"><div>
        
        <h1>Pengaturan</h1>
        
      </div></header>
      <form id="settings-form" class="settings-grid">

       <section class="card settings-card-v2">
  <h2>Energi dan Proteksi</h2>

  <div class="field-grid">
    <!-- KOLOM KIRI -->
    <div class="field">
      <label for="tariff-preset">Golongan tarif listrik</label>

      <select class="form-input" id="tariff-preset">
        <option value="900">900 VA</option>
        <option value="1300">1.300 VA</option>
        <option value="2200">2.200 VA</option>
        <option value="3500-5500">3.500–5.500 VA</option>
        <option value="6600-plus">6.600 VA ke atas</option>
        <option value="custom">Custom</option>
      </select>

      <label for="tariff">Tarif aktif (Rp/kWh)</label>

      <input
        class="form-input"
        id="tariff"
        type="number"
        min="0"
        max="100000"
        step="0.01"
        required
        readonly
      >

      <small id="tariff-info">Nilai tarif sesuai golongan.</small>
    </div>

    <!-- KOLOM KANAN -->
    <div class="field">
      <label for="overload-preset">Rating MCB</label>

      <select class="form-input" id="overload-preset">
        <option value="mcb-4">4 A</option>
        <option value="mcb-6">6 A</option>
        <option value="mcb-10">10 A</option>
        <option value="mcb-16">16 A</option>
        <option value="mcb-20">20 A</option>
        <option value="mcb-30-32">30/32 A</option>
        <option value="custom">Custom</option>
      </select>

      <label for="overload">Batas overload aktif (W)</label>

      <input
        class="form-input"
        id="overload"
        type="number"
        min="10"
        max="10000"
        step="1"
        required
        readonly
      >

      <small id="overload-info">Nilai batas sesuai rating MCB.</small>
    </div>
  </div>
</section>
        <section class="card settings-card-v2"><h2>Deteksi Beban</h2><div class="field-grid">
          <div class="field"><label for="power-threshold">Threshold daya (W)</label><input class="form-input" id="power-threshold" type="number" min="0.1" step="0.1" required></div>
          <div class="field"><label for="current-threshold">Threshold arus (A)</label><input class="form-input" id="current-threshold" type="number" min="0.001" step="0.001" required></div>
          <div class="field"><label for="removed-delay">Konfirmasi beban dicabut (detik)</label><input class="form-input" id="removed-delay" type="number" min="1" max="10" step="1" required></div>
        </div></section>
        <section class="card settings-card-v2"><h2>Status Konfigurasi</h2><p class="system-stamp" id="config-status">Membaca konfigurasi…</p><button class="btn btn-primary" type="submit">Simpan Pengaturan</button></section>
      </form>
    </main>
  </div></div>
 <script
  type="module"
  src="js/settings.js?v=20260907-4"
></script>
</body>
</html>
